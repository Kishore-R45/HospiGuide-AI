<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 650" width="700" height="650">
  <rect width="100%" height="100%" fill="#1e293b" />
  
  <!-- Outer walls -->
  <path d="M 50 50 L 650 50 L 650 600 L 50 600 Z" fill="none" stroke="#475569" stroke-width="6" />
  
  <!-- Corridors (light gray) -->
  <rect x="380" y="50" width="40" height="550" fill="#334155" />
  <rect x="50" y="360" width="600" height="40" fill="#334155" />
  <rect x="50" y="260" width="600" height="40" fill="#334155" />
  <rect x="50" y="460" width="600" height="40" fill="#334155" />

  <!-- Rooms -->
  <!-- Ophthalmology -->
  <rect x="150" y="200" width="200" height="100" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
  <text x="250" y="255" fill="#06b6d4" font-family="sans-serif" font-size="16" text-anchor="middle">Ophthalmology</text>
  
  <!-- Cardiology -->
  <rect x="450" y="200" width="200" height="100" fill="#0f172a" stroke="#f43f5e" stroke-width="2" />
  <text x="550" y="255" fill="#f43f5e" font-family="sans-serif" font-size="16" text-anchor="middle">Cardiology</text>
  
  <!-- Orthopedics -->
  <rect x="150" y="300" width="200" height="100" fill="#0f172a" stroke="#f97316" stroke-width="2" />
  <text x="250" y="355" fill="#f97316" font-family="sans-serif" font-size="16" text-anchor="middle">Orthopedics</text>
  
  <!-- Dermatology -->
  <rect x="450" y="300" width="200" height="100" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
  <text x="550" y="355" fill="#ec4899" font-family="sans-serif" font-size="16" text-anchor="middle">Dermatology</text>
  
  <!-- ENT -->
  <rect x="150" y="400" width="200" height="100" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
  <text x="250" y="455" fill="#a855f7" font-family="sans-serif" font-size="16" text-anchor="middle">ENT</text>
  
  <!-- Neurology -->
  <rect x="450" y="400" width="200" height="100" fill="#0f172a" stroke="#6366f1" stroke-width="2" />
  <text x="550" y="455" fill="#6366f1" font-family="sans-serif" font-size="16" text-anchor="middle">Neurology</text>

  <!-- Lifts & Stairs -->
  <rect x="360" y="150" width="80" height="80" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
  <text x="400" y="195" fill="#3b82f6" font-family="sans-serif" font-size="14" text-anchor="middle">Lift/Stairs</text>
  
</svg>
