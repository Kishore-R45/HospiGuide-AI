<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 650" width="700" height="650">
  <rect width="100%" height="100%" fill="#1e293b" />
  
  <!-- Outer walls -->
  <path d="M 50 50 L 650 50 L 650 600 L 50 600 Z" fill="none" stroke="#475569" stroke-width="6" />
  
  <!-- Corridors (light gray) -->
  <rect x="380" y="50" width="40" height="550" fill="#334155" />
  <rect x="50" y="360" width="600" height="40" fill="#334155" />
  <rect x="50" y="260" width="600" height="40" fill="#334155" />

  <!-- Rooms -->
  <!-- Entrance / Reception -->
  <rect x="300" y="500" width="200" height="100" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <text x="400" y="555" fill="#94a3b8" font-family="sans-serif" font-size="16" text-anchor="middle">Entrance &amp; Reception</text>
  
  <!-- Pharmacy -->
  <rect x="150" y="300" width="200" height="150" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <text x="250" y="380" fill="#94a3b8" font-family="sans-serif" font-size="16" text-anchor="middle">Pharmacy</text>
  
  <!-- Emergency -->
  <rect x="450" y="300" width="200" height="150" fill="#0f172a" stroke="#ef4444" stroke-width="3" />
  <text x="550" y="380" fill="#ef4444" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Emergency</text>
  
  <!-- Lab -->
  <rect x="150" y="100" width="200" height="150" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <text x="250" y="180" fill="#94a3b8" font-family="sans-serif" font-size="16" text-anchor="middle">Diagnostic Lab</text>
  
  <!-- General OPD -->
  <rect x="450" y="100" width="200" height="150" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <text x="550" y="180" fill="#94a3b8" font-family="sans-serif" font-size="16" text-anchor="middle">General OPD</text>

  <!-- Lifts & Stairs -->
  <rect x="360" y="150" width="80" height="80" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
  <text x="400" y="195" fill="#3b82f6" font-family="sans-serif" font-size="14" text-anchor="middle">Lift/Stairs</text>
  
</svg>
